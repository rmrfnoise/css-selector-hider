<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CSS Selector Hider</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "字体圈欣意吉祥宋",
            -apple-system, BlinkMacSystemFont,
            "Segoe UI Variable Text", "Segoe UI",
            "Helvetica Neue", Arial,
            "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei",
            sans-serif;
            background: #fff;
            color: #111;
            max-width: 560px;
            margin: 0 auto;
            padding: 64px 24px 80px;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: -0.005em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== 头部：只剩标题 ===== */
        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
            color: #111;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin: 0 0 32px;
        }

        /* 无障碍：视觉上隐藏但保留给屏幕阅读器 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ===== 规则列表 ===== */
        #list {
            margin-bottom: 32px;
        }

        /* 以下 .rule-item / .body / .match / .count / .del / .empty
           由 options.js 在运行时动态创建，WebStorm 静态扫描不到，
           用 noinspection 关掉“未使用的 CSS 选择器”提示。 */

        /*noinspection CssUnusedSymbol*/
        .rule-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ececec;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .body {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 14px 8px;
            text-decoration: none;
            color: #111;
            min-width: 0;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .match {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .body:hover .match {
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .count {
            font-size: 12px;
            color: #999;
            flex-shrink: 0;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .del {
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 18px;
            line-height: 1;
            padding: 8px 12px;
            cursor: pointer;
            transition: color .12s;
        }

        /*noinspection CssUnusedSymbol*/
        .rule-item .del:hover {
            color: #e5484d;
        }

        /*noinspection CssUnusedSymbol*/
        .empty {
            color: #999;
            font-size: 13px;
            padding: 28px 8px;
            border-bottom: 1px solid #ececec;
            margin: 0;
        }

        /* ===== 新增表单 ===== */
        .add {
            display: flex;
            gap: 8px;
        }

        .add input {
            flex: 1;
            padding: 10px 12px;
            font: inherit;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
            color: #111;
            transition: border-color .12s, box-shadow .12s;
        }

        .add input:focus {
            outline: none;
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .05);
        }

        .add input::placeholder {
            color: #bbb;
        }

        .add button {
            padding: 10px 18px;
            cursor: pointer;
            border: none;
            background: #111;
            color: #fff;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: background .12s;
        }

        .add button:hover {
            background: #333;
        }

        /* ===== 底部：语言切换 + 导入导出 ===== */
        .page-footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #ececec;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* 语言切换放左侧，导入导出推到右侧 */
        #lang-toggle {
            margin-right: auto;
        }

        .link-btn {
            border: none;
            background: transparent;
            padding: 0;
            color: #888;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: color .12s;
        }

        .link-btn:hover {
            color: #111;
        }
    </style>
</head>
<body>
<h1 data-i18n="options_title">CSS Selector Hider</h1>
<p class="subtitle" data-i18n="options_subtitle">Configure CSS selectors per site to hide elements you don't want to
    see.</p>

<div id="list"></div>

<form class="add" id="add-form">
    <label for="new-match" class="sr-only" data-i18n="options_url_label">URL fragment</label>
    <input id="new-match" data-i18n-placeholder="options_placeholder"
           placeholder="URL fragment, e.g. docs.qq.com"
           required>
    <button type="submit" data-i18n="options_add">Add</button>
</form>

<div class="page-footer">
    <button id="lang-toggle" class="link-btn">English</button>
    <button id="export-btn" class="link-btn" data-i18n="options_export">Export</button>
    <button id="import-btn" class="link-btn" data-i18n="options_import">Import</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
</div>

<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
